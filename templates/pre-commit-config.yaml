# .pre-commit-config.yaml — see lab-conventions/reference/code-quality.md
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.0
    hooks:
      - id: uv-lock
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
  - repo: local
    hooks:
      - id: typecheck
        name: pyrefly check
        entry: uv run pyrefly check src
        language: system
        pass_filenames: false
      - id: notebook-check
        name: marimo check
        entry: uv run marimo check --strict notebooks/
        language: system
        pass_filenames: false
        files: ^notebooks/.*\.py$
